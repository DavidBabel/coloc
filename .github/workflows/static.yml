# Workflow optimisé pour runner local Windows avec repli sur GitHub-hosted
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1 : Tentative sur ton runner local (Windows)
  deploy-local:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Étape cruciale : On prépare un dossier propre via PowerShell
      # pour éviter les erreurs de chemins Bash sous Windows
      - name: Prepare Files (Windows Friendly)
        shell: pwsh
        run: |
          $publishDir = ".\_site_dist"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Force -Path $publishDir

          # Liste ici les fichiers/dossiers à déployer.
          # Par défaut, on copie tout sauf les dossiers système du runner
          Get-ChildItem -Exclude ".git", ".github", "_site_dist", "_actions", "_work" | Copy-Item -Destination $publishDir -Recurse -Force
          Write-Host "Dossier de déploiement préparé dans $publishDir"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # On utilise le dossier temporaire qu'on vient de créer
          path: './_site_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 2 : Fallback automatique si le local échoue ou est hors-ligne
  deploy-cloud:
    needs: deploy-local
    # S'exécute si le job local a échoué (failure) ou a été annulé (cancelled/timeout)
    if: always() && (needs.deploy-local.result == 'failure' || needs.deploy-local.result == 'cancelled')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
