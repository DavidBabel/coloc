name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-local:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Correction du chemin : On utilise PowerShell pour préparer l'environnement
      # car les actions JS de GitHub s'emmêlent les pinceaux avec les slashs Windows.
      - name: Fix Path and Setup Pages
        id: setup
        shell: pwsh
        run: |
          Write-Host "Nettoyage des anciens artefacts..."
          if (Test-Path "_site") { Remove-Item -Recurse -Force _site }
          New-Item -ItemType Directory -Force -Path _site
          # Copie tes fichiers dans un dossier propre pour l'artefact
          Copy-Item -Path ".\*" -Destination "_site" -Recurse -Exclude ".git",".github","_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # On pointe vers le dossier qu'on vient de créer proprement
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fallback si le local échoue ou est éteint
  deploy-cloud:
    needs: deploy-local
    if: always() && needs.deploy-local.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
