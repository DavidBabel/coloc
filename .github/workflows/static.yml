name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build-local:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si tu as du build, tu peux rajouter ici
      # - run: npm run build

      - name: Prepare dist folder
        shell: powershell
        run: |
          $dist = "_dist"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Force -Path $dist
          Get-ChildItem -Exclude ".git", ".github", "_dist", "_actions", "_work" | Copy-Item -Destination $dist -Recurse -Force

      - name: Zip artifact
        shell: powershell
        run: |
          if (Test-Path "site.zip") { Remove-Item -Force "site.zip" }
          Compress-Archive -Path "_dist\*" -DestinationPath "site.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-zip
          path: site.zip


  deploy-cloud:
    needs: build-local
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-zip

      - name: Unzip artifact
        run: |
          mkdir site
          unzip site.zip -d site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
