name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  deploy-local:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Files (Windows)
        shell: powershell
        run: |
          $publishDir = ".\_site_dist"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Force -Path $publishDir
          Get-ChildItem -Exclude ".git", ".github", "_site_dist", "_actions", "_work" | Copy-Item -Destination $publishDir -Recurse -Force
          Write-Host "Dossier de déploiement prêt : $publishDir"

      - name: Zip artifact for Windows
        shell: powershell
        run: |
          if (Test-Path "site.zip") { Remove-Item -Force "site.zip" }
          Compress-Archive -Path "_site_dist\*" -DestinationPath "site.zip"
          Write-Host "ZIP généré"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site.zip

      - name: Deploy locally to GitHub Pages
        id: deploy-local
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site-zip

  deploy-cloud:
    needs: deploy-local
    if: always() && (needs.deploy-local.result == 'failure' || needs.deploy-local.result == 'cancelled')
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip

      - name: Unzip artifact
        run: |
          mkdir site
          unzip site.zip -d site

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to Pages
        id: deploy-cloud
        uses: actions/deploy-pages@v4
