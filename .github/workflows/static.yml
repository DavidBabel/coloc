# Workflow optimisé pour runner local Windows avec repli sur GitHub-hosted
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # JOB 1 : tentative locale via self-hosted (Windows)
  deploy-local:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Files (Windows)
        shell: powershell
        run: |
          $publishDir = ".\_site_dist"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Force -Path $publishDir
          Get-ChildItem -Exclude ".git", ".github", "_site_dist", "_actions", "_work" | Copy-Item -Destination $publishDir -Recurse -Force
          Write-Host "Dossier de déploiement préparé dans $publishDir"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 2 : fallback auto si runner local HS / offline / timeout
  deploy-cloud:
    needs: deploy-local
    if: always() && (needs.deploy-local.result == 'failure' || needs.deploy-local.result == 'cancelled')
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (cloud)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
