# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-local:
    runs-on: self-hosted
    # On retire continue-on-error pour que le job échoue réellement s'il y a un souci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Local (Custom Step)
        shell: bash
        run: |
          echo "Tentative de build local..."
          # Si tu as une commande de build, mets là ici.
          # Note : Les actions 'upload-pages-artifact' plantent souvent sur Windows local.
          # Si ce job échoue, il passera la main au cloud.
          exit 1 # On force l'échec ici pour tester le fallback ou si l'action plante

  deploy-cloud:
    needs: deploy-local
    if: always() && needs.deploy-local.result == 'failure'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
